name: Suggest an idea
description: Something ThirtyFile should do, or do better
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: The situation you are in and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. A sketch or an example from another program is welcome.
    validations:
      required: true
  - type: textarea
    id: instead
    attributes:
      label: What do you do instead for now?
