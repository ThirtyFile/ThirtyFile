# Checks every pull request and every push to main, and publishes the Docker image to the GitHub Container Registry:
#   push to main      ghcr.io/thirtyfile/thirtyfile:edge      (the newest code, not yet released)
#   tag v1.2.3        ghcr.io/thirtyfile/thirtyfile:1.2.3, :1.2 and :latest, plus a GitHub release
# Pull requests are built (amd64 only) but not published.
# Changes that only touch the website or the documentation skip the tests and the image; the skipped jobs still
# count as passed, so such pull requests can be merged.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/thirtyfile/thirtyfile

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Releases and manual runs always build; so does anything whose starting point is unknown
          if [ "$EVENT" = "workflow_dispatch" ] || [ "${REF#refs/tags/}" != "$REF" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          # Everything except the website, the documentation, the community files and the issue / pull request forms is code
          if echo "$changed" | grep -qvE '^(site/|README\.md$|LICENSE$|\.github/(ISSUE_TEMPLATE/|pull_request_template\.md$|CONTRIBUTING\.md$|CODE_OF_CONDUCT\.md$|SECURITY\.md$|release\.yml$|dependabot\.yml$|workflows/pages\.yml$))'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          node scripts/check-i18n.mjs
          pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Backend
        working-directory: server
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

  image:
    name: Docker image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is added by itself for version tags
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      # The backend is cross-compiled in the Dockerfile, so arm64 needs no emulation. Pull requests build amd64 only, to be quicker
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Release notes are put together from the merged pull requests (see .github/release.yml)
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
