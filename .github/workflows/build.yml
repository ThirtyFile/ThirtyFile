# Checks every pull request: runs the tests and builds the Docker image (amd64 only, not published).
# Merging into main runs nothing here; images are only published by the Release workflow (release.yml), which
# calls this workflow with a version number to build both platforms and push:
#   ghcr.io/thirtyfile/thirtyfile:1.2.3, :1.2 and :latest
# Pull requests that only touch the website or the documentation skip the tests and the image. The required check is
# "Checks passed" at the end: it passes when every job passed or was skipped, and fails when any failed or was cancelled.
name: Build

on:
  pull_request:
  workflow_call:
    inputs:
      release_version:
        description: Version to publish, such as 1.2.3
        type: string
        required: true

concurrency:
  group: build-${{ github.ref }}-${{ inputs.release_version || 'check' }}
  cancel-in-progress: ${{ !inputs.release_version }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/thirtyfile/thirtyfile
  # Empty for pull requests
  RELEASE: ${{ inputs.release_version }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Releases always build; so does anything whose starting point is unknown
          if [ -n "$RELEASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          # Everything except the website, the documentation, the community files and the issue / pull request forms is code
          if echo "$changed" | grep -qvE '^(site/|README\.md$|LICENSE$|\.github/(ISSUE_TEMPLATE/|pull_request_template\.md$|CONTRIBUTING\.md$|CODE_OF_CONDUCT\.md$|SECURITY\.md$|release\.yml$|dependabot\.yml$|workflows/pages\.yml$))'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          node scripts/check-i18n.mjs
          pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Backend
        working-directory: server
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

  image:
    name: Docker image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
        id: buildx

      # The Dockerfile's cache mounts (compiled Rust dependencies, downloaded crates and pnpm packages) only
      # live inside the builder, which is new on every run. Keep them in the Actions cache, so that a change
      # to the backend recompiles ThirtyFile itself and not every dependency. The key changes with the
      # lock files; in between, the saved dependencies stay valid and the cache is only restored.
      - id: mounts
        uses: actions/cache@v6
        with:
          path: cache-mount
          key: buildkit-${{ inputs.release_version && 'multi' || 'amd64' }}-${{ hashFiles('server/Cargo.lock', 'web/pnpm-lock.yaml', 'Dockerfile') }}
          restore-keys: |
            buildkit-${{ inputs.release_version && 'multi' || 'amd64' }}-
            buildkit-

      - uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "cache-mount/pnpm-store": { "target": "/root/.local/share/pnpm/store", "id": "pnpm-store" },
              "cache-mount/cargo-registry": { "target": "/usr/local/cargo/registry", "id": "cargo-registry" },
              "cache-mount/target-amd64": { "target": "/src/server/target", "id": "thirtyfile-target-amd64" },
              "cache-mount/target-arm64": { "target": "/src/server/target", "id": "thirtyfile-target-arm64" }
            }
          skip-extraction: ${{ steps.mounts.outputs.cache-hit }}

      - uses: docker/login-action@v4
        if: inputs.release_version
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Releases: 1.2.3, 1.2 and latest. Pull requests: pr-N (never pushed)
      - id: tags
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$RELEASE" ]; then
            {
              echo "version=$RELEASE"
              echo "list<<EOF"
              echo "$IMAGE:$RELEASE"
              echo "$IMAGE:${RELEASE%.*}"
              echo "$IMAGE:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "version=pr-$PR" >> "$GITHUB_OUTPUT"
            echo "list=$IMAGE:pr-$PR" >> "$GITHUB_OUTPUT"
          fi

      # Standard image labels (source, revision, creation time…) with the version set above
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          labels: org.opencontainers.image.version=${{ steps.tags.outputs.version }}

      # The backend is cross-compiled in the Dockerfile, so arm64 needs no emulation. Pull requests build amd64 only, to be quicker
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ inputs.release_version && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ !!inputs.release_version }}
          tags: ${{ steps.tags.outputs.list }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The one check the ruleset requires. Skipped jobs count as passed on GitHub, so when "Changes" itself fails, the
  # tests and the image are skipped and would let the pull request through; this job fails in that case.
  result:
    name: Checks passed
    needs: [changes, check, image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes, tests, image: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
