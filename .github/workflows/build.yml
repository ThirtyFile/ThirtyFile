# Complete verification, called before releases or started by hand (Actions > Build > Run workflow).
# Pull requests run checks.yml; pushes to main run CodeQL, without repeating the tests or builds.
#
# Explicit verification also builds both image platforms once the tests have passed, without
# pushing them, with the quicker `ci` Cargo profile (server/Cargo.toml). Each platform's image is started with the shipped compose.yaml on bind-mounted folders, first the latest
# release and then the new image on its data, and restarted (.github/scripts/smoke-test.sh): amd64 natively, arm64
# under QEMU.
#
# The Release workflow (release.yml) calls this workflow with a version number: the same happens, and only then is the
# image pushed for both platforms, by its digest and without a tag, from the same build (a step checks that the pushed
# images are the ones that were started). release.yml gives it its tags. So a release whose tests or image fail leaves
# nothing behind in the registry. Releases build with the `release` profile.
#
# Caches are saved only when verifying main, including releases. Other refs restore them without saving their own.
#
# The result fails if any full-verification job fails or is cancelled. The PR gate is defined in checks.yml.
name: Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        description: Version to publish, such as 1.2.3
        type: string
        required: true
    outputs:
      digest:
        description: Digest of the pushed image (sha256:…), for releases
        value: ${{ jobs.image.outputs.digest }}

# Explicit full verification and releases always finish; no per-commit build is started.
concurrency:
  group: build-${{ github.ref }}-${{ inputs.release_version || (github.event_name == 'push' && github.sha) || 'check' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/thirtyfile/thirtyfile

jobs:
  changes:
    name: Changes
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      image: ${{ steps.diff.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          # Explicit verification has no diff base and always runs the full checks.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RELEASE: ${{ inputs.release_version }}
        run: |
          # Releases always build; so does anything whose starting point is unknown
          if [ -n "$RELEASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          # Everything except the website, the documentation, the community files and the issue / pull request forms is code
          if echo "$changed" | grep -qvE '^(site/|README(\.[a-zA-Z-]+)?\.md$|LICENSE$|\.github/(ISSUE_TEMPLATE/|pull_request_template\.md$|CONTRIBUTING\.md$|CODE_OF_CONDUCT\.md$|SECURITY\.md$|release\.yml$|dependabot\.yml$|workflows/(pages|codeql|scan)\.yml$))'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # What decides how the image is built and started
          if echo "$changed" | grep -qE '^(Dockerfile|\.dockerignore|compose\.yaml|server/(Cargo\.(toml|lock)|about\.(toml|hbs)|rust-toolchain\.toml)|web/(package\.json|pnpm-lock\.yaml|scripts/third-party-notices\.mjs)|\.github/(scripts/smoke-test\.sh|workflows/build\.yml))$'; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

  # The database structure is frozen at v0.4.0: data folders made by a release must keep starting, and the server
  # refuses a database whose applied migration file has changed since (db.rs, "made by a different build"). Changes to
  # the structure go into a new migration file (0002_…), and the database is copied before it runs
  migrations:
    name: Released migrations unchanged
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          # v0.4.0 and the newest release: every migration file in them is still here, byte for byte
          latest=$(git tag -l 'v*' --sort=-v:refname | grep -v -- - | head -n 1)
          failed=0
          for tag in v0.4.0 $latest; do
            for file in $(git ls-tree -r --name-only "$tag" -- server/migrations/); do
              if ! git diff --quiet "$tag" HEAD -- "$file"; then
                echo "::error file=$file::$file differs from the file released in $tag. Released migrations never change: put the change in a new file, server/migrations/000N_<name>.sql"
                failed=1
              fi
            done
          done
          exit "$failed"

  # The website: every translated page exists in each language with matching language links, and the links inside
  # it resolve. Quick, so it runs on every change, the website's own included
  site:
    name: Website
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/check.sh site

  check:
    name: Tests
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # The full checks are the ones contributors run locally too.
      # The interface: formatting (oxfmt, web/.oxfmtrc.json), translations, types, lint (oxlint, web/.oxlintrc.json)
      # and the unit tests (Vitest), with the coverage in the job summary
      - name: Frontend
        run: |
          bash scripts/check.sh web --coverage
          (cd web && node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY")

      # rustup installs the version, clippy and rustfmt named in server/rust-toolchain.toml on first use
      - run: rustup toolchain install
        working-directory: server
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The backend's formatting (rustfmt, server/rustfmt.toml), then its tests (cargo test), clippy, and the end-to-end
      # test in a real browser (sign in, upload, preview, download) run against one build instrumented for coverage (cargo llvm-cov show-env): the dependencies are
      # compiled once for both, and the coverage in the job summary counts what the browser test reaches too.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov
      - name: Backend and end-to-end test
        env:
          # The end-to-end tests run 4 at a time, more than Playwright's default here (2), so that a test that isn't
          # safe to run next to the others fails here rather than on main
          E2E_WORKERS: 4
        run: |
          (cd web && pnpm exec playwright install --with-deps chromium)
          cd server
          rustup component add llvm-tools-preview
          source <(cargo llvm-cov show-env --sh)
          # Coverage data left in a restored cache would count twice (cargo llvm-cov clean refuses the cached target
          # folder, which has no CACHEDIR.TAG)
          find "$CARGO_LLVM_COV_TARGET_DIR" -maxdepth 1 -name '*.profraw' -delete 2>/dev/null || true
          bash ../scripts/check.sh server
          bash ../scripts/check.sh e2e
          {
            echo "### Backend coverage (tests and the browser test)"
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # A floor under the lines covered (91.8% by the tests alone, the same from run to run, in October 2026): raised
          # as tests are added, never lowered to let a change through
          cargo llvm-cov report --fail-under-lines 90 > /dev/null

      # Known security problems in dependencies, their licences and where they come from (server/deny.toml)
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: server/Cargo.toml
      # And of the npm packages; their licences are checked against the list in web/scripts/third-party-notices.mjs,
      # which also writes their notices into the image
      - name: Frontend dependencies
        working-directory: web
        run: |
          pnpm audit --prod
          pnpm licenses list --prod --json > "$RUNNER_TEMP/licences-prod.json"
          pnpm licenses list --dev --json > "$RUNNER_TEMP/licences-dev.json"
          node scripts/third-party-notices.mjs "$RUNNER_TEMP/licences-prod.json" "$RUNNER_TEMP/licences-dev.json" > /dev/null

  # After the tests, when the image may have changed, and for releases: builds, starts and (releases only) pushes it
  image:
    name: Docker image
    timeout-minutes: 90
    needs: [changes, check]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      VERSION: ${{ inputs.release_version || 'dev' }}
      # The images people run use `release`; the ones only started here compile ThirtyFile several times faster
      CARGO_PROFILE: ${{ inputs.release_version && 'release' || 'ci' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The commit's time instead of the build's: the builds below then write the same image configuration, so the
      # pushed images can be compared with the ones that were started
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      # Starting the arm64 image on this amd64 machine needs QEMU (building it doesn't: the Dockerfile cross-compiles)
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          cache-image: ${{ github.ref == 'refs/heads/main' }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx

      # The Dockerfile's cache mounts (compiled Rust dependencies, downloaded crates and pnpm packages) only
      # live inside the builder, which is new on every run. Keep them in the Actions cache, so that a change
      # to the backend recompiles ThirtyFile itself and not every dependency. The key changes with the
      # lock files; in between, the saved dependencies stay valid and the cache is only restored. Each profile has
      # its own, since the dependencies are compiled for it.
      # This is the image's only cache: a layer cache (cache-to: type=gha) would store much the same again, and
      # the two would push each other out of the 10 GB the repository gets. Saved from main only (see the top)
      - id: mounts
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache-mount
          key: buildkit-${{ env.CARGO_PROFILE }}-${{ hashFiles('server/Cargo.lock', 'web/pnpm-lock.yaml', 'Dockerfile') }}
          restore-keys: |
            buildkit-${{ env.CARGO_PROFILE }}-
      - if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache-mount
          key: buildkit-${{ env.CARGO_PROFILE }}-${{ hashFiles('server/Cargo.lock', 'web/pnpm-lock.yaml', 'Dockerfile') }}
          restore-keys: |
            buildkit-${{ env.CARGO_PROFILE }}-

      - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "cache-mount/pnpm-store": { "target": "/root/.local/share/pnpm/store", "id": "pnpm-store" },
              "cache-mount/cargo-registry": { "target": "/usr/local/cargo/registry", "id": "cargo-registry" },
              "cache-mount/target-amd64": { "target": "/src/server/target", "id": "thirtyfile-target-amd64" },
              "cache-mount/target-arm64": { "target": "/src/server/target", "id": "thirtyfile-target-arm64" }
            }
          # Taken out of the builder only to be saved
          skip-extraction: ${{ github.ref != 'refs/heads/main' || steps.mounts.outputs.cache-hit == 'true' }}

      # Standard image labels (source, revision, creation time…) with the version
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: org.opencontainers.image.version=${{ env.VERSION }}

      # Each platform's image, loaded into Docker to be started. The backend is cross-compiled in the Dockerfile, so
      # building for arm64 needs no emulation
      - name: Build for amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: thirtyfile:amd64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            CARGO_PROFILE=${{ env.CARGO_PROFILE }}
          sbom: false
          provenance: false
      - name: Start the amd64 image
        run: bash .github/scripts/smoke-test.sh thirtyfile:amd64
      - name: Build for arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: thirtyfile:arm64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            CARGO_PROFILE=${{ env.CARGO_PROFILE }}
          sbom: false
          provenance: false
      - name: Start the arm64 image (QEMU)
        env:
          SMOKE_PLATFORM: linux/arm64
        run: bash .github/scripts/smoke-test.sh thirtyfile:arm64

      # Releases only, once everything above has passed: both platforms from the same builder (so from its cache: the
      # same images), pushed by digest only (release.yml adds the tags), with an SBOM and the full build provenance;
      # release.yml also signs the provenance
      - if: inputs.release_version
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: Push both platforms
        if: inputs.release_version
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: ${{ env.IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            CARGO_PROFILE=${{ env.CARGO_PROFILE }}
          sbom: true
          provenance: mode=max
      # Each platform's image in the pushed index is the one started above: its image id is the pushed manifest's
      # digest (containerd image store) or its configuration's (Docker's classic store)
      - name: Check the pushed images are the ones started
        if: inputs.release_version
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          index=$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST")
          for arch in amd64 arm64; do
            manifest=$(jq -r --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' <<<"$index")
            config=$(docker buildx imagetools inspect --raw "$IMAGE@$manifest" | jq -r .config.digest)
            started=$(docker image inspect -f '{{.Id}}' "thirtyfile:$arch")
            echo "$arch: pushed $manifest (configuration $config), started $started"
            if [ "$started" != "$manifest" ] && [ "$started" != "$config" ]; then
              echo "::error::The pushed $arch image isn't the one that was started."
              exit 1
            fi
          done

  # The one check the ruleset requires. Skipped jobs count as passed on GitHub, so when "Changes" itself fails, the
  # tests and the image are skipped and would let the pull request through; this job fails in that case.
  result:
    name: Checks passed
    timeout-minutes: 5
    needs: [changes, migrations, site, check, image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes, migrations, website, tests, image: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
