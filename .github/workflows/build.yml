# Checks every pull request: runs the tests. Merging into main runs nothing here.
# The Docker image is only built by the Release workflow (release.yml), which calls this workflow with a version
# number: the tests run and the image is built for both platforms side by side, started once, and pushed by its digest
# without a tag. release.yml gives it its tags (1.2.3, 1.2, 1, latest) only once the tests have passed as well, so the
# published image is exactly the one that was built and started here.
# Pull requests that only touch the website or the documentation skip the tests. The required check is "Checks passed"
# at the end: it passes when every job passed or was skipped, and fails when any failed or was cancelled.
name: Build

on:
  pull_request:
  workflow_call:
    inputs:
      release_version:
        description: Version to publish, such as 1.2.3
        type: string
        required: true
    outputs:
      digest:
        description: Digest of the pushed image (sha256:…), for releases
        value: ${{ jobs.image.outputs.digest }}

concurrency:
  group: build-${{ github.ref }}-${{ inputs.release_version || 'check' }}
  cancel-in-progress: ${{ !inputs.release_version }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/thirtyfile/thirtyfile

jobs:
  changes:
    name: Changes
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          RELEASE: ${{ inputs.release_version }}
        run: |
          # Releases always build; so does anything whose starting point is unknown
          if [ -n "$RELEASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          # Everything except the website, the documentation, the community files and the issue / pull request forms is code
          if echo "$changed" | grep -qvE '^(site/|README\.md$|LICENSE$|\.github/(ISSUE_TEMPLATE/|pull_request_template\.md$|CONTRIBUTING\.md$|CODE_OF_CONDUCT\.md$|SECURITY\.md$|release\.yml$|dependabot\.yml$|workflows/pages\.yml$))'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Tests
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Only type-checked and linted (oxlint, web/.oxlintrc.json) here: the Docker image job builds the frontend. The backend tests don't need it (without
      # web/dist, the server is compiled without pages)
      - name: Frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          node scripts/check-i18n.mjs
          pnpm typecheck
          pnpm lint

      # Unit tests (Vitest), with the coverage in the job summary
      - name: Frontend tests
        working-directory: web
        run: |
          pnpm test --coverage
          node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      # rustup installs the version and clippy named in server/rust-toolchain.toml on first use
      - run: rustup toolchain install
        working-directory: server
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server

      # The backend tests (cargo test) and the end-to-end test in a real browser (sign in, upload, preview, download)
      # run against one build instrumented for coverage (cargo llvm-cov show-env): the dependencies are compiled once
      # for both, and the coverage in the job summary counts what the browser test reaches too. The frontend is built
      # first, so the server embeds it (build.rs) and the tests and the server compile alike.
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov
      - name: Backend and end-to-end test
        run: |
          (cd web && pnpm build && pnpm exec playwright install --with-deps chromium)
          cd server
          rustup component add llvm-tools-preview
          (
            source <(cargo llvm-cov show-env --export-prefix)
            cargo llvm-cov clean --workspace
            cargo test --locked
            cargo build --locked
            (cd ../web && THIRTYFILE_BIN="$CARGO_LLVM_COV_TARGET_DIR/debug/thirtyfile" pnpm test:e2e)
            {
              echo "### Backend coverage (tests and the browser test)"
              echo '```'
              cargo llvm-cov report --summary-only
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          )
          cargo clippy --locked --all-targets -- -D warnings

      # Known security problems in dependencies, their licences and where they come from (server/deny.toml)
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: server/Cargo.toml
      - name: Frontend dependencies
        working-directory: web
        run: pnpm audit --prod

  # Releases only: runs beside the tests rather than after them, and release.yml waits for both
  image:
    name: Docker image
    timeout-minutes: 45
    needs: changes
    if: inputs.release_version && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx

      # The Dockerfile's cache mounts (compiled Rust dependencies, downloaded crates and pnpm packages) only
      # live inside the builder, which is new on every run. Keep them in the Actions cache, so that a change
      # to the backend recompiles ThirtyFile itself and not every dependency. The key changes with the
      # lock files; in between, the saved dependencies stay valid and the cache is only restored.
      # This is the image's only cache: a layer cache (cache-to: type=gha) would store much the same again, and
      # the two would push each other out of the 10 GB the repository gets.
      - id: mounts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache-mount
          key: buildkit-multi-${{ hashFiles('server/Cargo.lock', 'web/pnpm-lock.yaml', 'Dockerfile') }}
          restore-keys: |
            buildkit-multi-

      - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "cache-mount/pnpm-store": { "target": "/root/.local/share/pnpm/store", "id": "pnpm-store" },
              "cache-mount/cargo-registry": { "target": "/usr/local/cargo/registry", "id": "cargo-registry" },
              "cache-mount/target-amd64": { "target": "/src/server/target", "id": "thirtyfile-target-amd64" },
              "cache-mount/target-arm64": { "target": "/src/server/target", "id": "thirtyfile-target-arm64" }
            }
          skip-extraction: ${{ steps.mounts.outputs.cache-hit }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Standard image labels (source, revision, creation time…) with the version set above
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: org.opencontainers.image.version=${{ inputs.release_version }}

      # The backend is cross-compiled in the Dockerfile, so arm64 needs no emulation. Pushed by digest only
      # (release.yml adds the tags), with an SBOM and the full build provenance; release.yml also signs the provenance
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: ${{ env.IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ inputs.release_version }}
          sbom: true
          provenance: mode=max

      # Starts the pushed image itself (its amd64 half) locked down (read-only, minimal capabilities), and upgrades
      # the latest release to it
      - name: Start the image
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: bash .github/scripts/smoke-test.sh "$REF"

  # The one check the ruleset requires. Skipped jobs count as passed on GitHub, so when "Changes" itself fails, the
  # tests and the image are skipped and would let the pull request through; this job fails in that case.
  result:
    name: Checks passed
    timeout-minutes: 5
    needs: [changes, check, image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes, tests, image: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
