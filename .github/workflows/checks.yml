# The required pull-request gate: formatting, translations, types, lint, the interface's unit tests, and the server
# compiled with clippy, so nothing that doesn't build reaches main. No server tests, coverage, browser tests or image
# builds: complete verification is run locally, before releases, or through Build's manual entry point.
# Pushes to main run it too, to keep the Rust build cache warm for pull requests (they restore it; only main saves it).
name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Checks passed
    runs-on: ubuntu-latest
    # A cold Rust cache compiles every dependency once
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The Dockerfile's web stage's version (Dependabot updates that one: change these with it)
          node-version: 26.11.1
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: rustup toolchain install
        working-directory: server
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
          shared-key: checks
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bash scripts/check.sh quick
