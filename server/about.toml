# cargo about: the licence notices of every crate built into ThirtyFile, written to THIRD-PARTY-NOTICES in the Docker
# image (template: about.hbs; see the Dockerfile). Accepts the same licences as deny.toml and web/scripts/third-party-notices.mjs:
# keep the lists equal.
accepted = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# The platforms of the Docker image: crates used only on other platforms aren't built into it
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
# Only what ends up in the binary: build scripts and test helpers aren't distributed
ignore-build-dependencies = true
ignore-dev-dependencies = true
