[package]
name = "thirtyfile"
# Not the release number: releases set it when they are built (THIRTYFILE_VERSION, see lib.rs), so builds that aren't
# a release call themselves "dev"
version = "0.0.0"
edition = "2024"
# Dependencies (russh etc.) require 1.89
rust-version = "1.89"
description = "A self-hosted file manager that looks and works like Windows File Explorer, in your browser"
license = "Apache-2.0"
repository = "https://github.com/ThirtyFile/ThirtyFile"
homepage = "https://thirtyfile.github.io/ThirtyFile/"
publish = false

[[bin]]
name = "thirtyfile"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.7", features = ["trace", "compression-gzip", "compression-br", "timeout", "catch-panic"] }
futures-util = "0.3"
bytes = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
# The SQL function unicode_lower() (db.rs); the same version sqlx uses
libsqlite3-sys = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
sha2 = "0.11"
hmac = "0.13"
# Encryption of the secrets saved in the database (secrets.rs); already used by russh
aes-gcm = "0.11"
subtle = "2"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "server-graceful", "tokio"] }
tower = { version = "0.5", features = ["util"] }
hex = "0.4"
base64 = "0.23"
argon2 = "0.6"
crc32fast = "1"
percent-encoding = "2"
mime_guess = "2"
rust-embed = "8"
# Log archive files (.jsonl.gz)
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
object_store = { version = "0.14.2", features = ["aws"] }
russh = "0.63"
russh-sftp = "3"
suppaftp = { version = "12", features = ["tokio-rustls-aws-lc-rs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
tokio-rustls = { version = "0.26", default-features = false }
rustls-platform-verifier = "0.7"
form_urlencoded = "1"
# Two-factor sign-in: TOTP codes (HMAC-SHA-1, RFC 6238), the secret in base32, and the QR code to scan (as SVG)
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
sha1 = "0.11"
data-encoding = "2"
# WebDAV (dav/): reading the XML requests, and dates in HTTP format; both already used by object_store and hyper.
# object_store still uses quick-xml 0.41, so two versions are built until it moves to 0.42
quick-xml = "0.42"
httpdate = "1"
# Backup schedules in a named time zone (backups/policy.rs), with the time zone database built in: the Docker image
# has none
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }

[target.'cfg(unix)'.dependencies]
# Switching to an unprivileged user in the Docker image (privileges.rs)
libc = "0.2"

# The Docker image is a static musl build and keeps musl's own memory allocator. Measured against mimalloc
# (same build, 4 cores, 160 concurrent 4 MB saves, 24 thumbnails of 1600×1200 pictures, 8 concurrent ZIPs of
# 320 MB; see #54): mimalloc saved about 30% of the time on concurrent saves and changed thumbnails and ZIPs
# little, but more than doubled peak memory (about 225 MB instead of 105 MB). With MIMALLOC_PURGE_DELAY=0 and
# MIMALLOC_ARENA_EAGER_COMMIT=0 it still used 30% more memory and the gain was gone. Small servers (#50) matter more.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# The images that pull requests and main build to start them (build.yml): the same code as `release`, compiled in
# parallel and without link-time optimisation. Slower and larger at run time; releases always use `release`
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16

# Every test that creates an account hashes its password with Argon2 (19 MiB, two passes). Unoptimized, a hash is
# slow enough to take most of the time cargo test runs; optimizing only the hashing crates keeps the rest debuggable.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs"] }
