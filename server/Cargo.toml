[package]
name = "thirtyfile"
version = "0.1.0"
edition = "2024"
# Dependencies (russh etc.) require 1.89
rust-version = "1.89"
description = "A self-hosted file manager that looks and works like Windows File Explorer, in your browser"
license = "Apache-2.0"
repository = "https://github.com/ThirtyFile/ThirtyFile"
homepage = "https://thirtyfile.github.io/ThirtyFile/"
publish = false

[[bin]]
name = "thirtyfile"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.7", features = ["trace", "compression-gzip", "compression-br", "timeout"] }
futures-util = "0.3"
bytes = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
sha2 = "0.11"
hmac = "0.13"
subtle = "2"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "server-graceful", "tokio"] }
tower = { version = "0.5", features = ["util"] }
hex = "0.4"
base64 = "0.23"
argon2 = "0.6"
crc32fast = "1"
percent-encoding = "2"
mime_guess = "2"
rust-embed = "8"
# Log archive files (.jsonl.gz)
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
object_store = { version = "0.14.2", features = ["aws"] }
russh = "0.63"
russh-sftp = "3"
suppaftp = { version = "12", features = ["tokio-rustls-aws-lc-rs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
tokio-rustls = { version = "0.26", default-features = false }
rustls-platform-verifier = "0.7"
form_urlencoded = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
