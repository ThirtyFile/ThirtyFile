# cargo deny check: known security problems, licences, and where crates come from. Runs in the Tests check.

[advisories]
# RustSec advisories, including crates marked unmaintained or unsound; yanked versions fail too
yanked = "deny"
ignore = [
  # rsa (through russh, the SFTP client): not constant-time, no fixed version exists yet. ThirtyFile only uses it to
  # sign in to an SFTP server with an RSA key the administrator configured; Ed25519 keys don't use it at all, and the
  # storage guide recommends them. Remove this once rsa is fixed.
  { id = "RUSTSEC-2023-0071", reason = "No fix available; only used for SFTP sign-in with an RSA key" },
]

[licenses]
# Permissive licences only: ThirtyFile is Apache-2.0 and ships as one binary with its dependencies.
# about.toml (the licence notices in the Docker image) accepts the same list, and so does web/scripts/third-party-notices.mjs
# for npm packages (with OFL-1.1 for the font): keep them equal.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
# A crate built in two versions makes the binary larger and slower to build. These come from the dependencies'
# own dependencies, waiting for them to move to the newer version; anything else new is reported (as a warning)
multiple-versions = "warn"
wildcards = "deny"
skip = [
  { crate = "atoi@2.0.0", reason = "sqlx-sqlite" },
  { crate = "base64@0.22.1", reason = "sqlx-core" },
  { crate = "block-buffer@0.10.4", reason = "the 0.10 RustCrypto crates sqlx and crc-fast use" },
  { crate = "cpufeatures@0.2.17", reason = "the 0.10 RustCrypto crates sqlx and crc-fast use" },
  { crate = "crypto-common@0.1.6", reason = "the 0.10 RustCrypto crates sqlx and crc-fast use" },
  { crate = "digest@0.10.7", reason = "the 0.10 RustCrypto crates sqlx and crc-fast use" },
  { crate = "generic-array@0.14.9", reason = "the 0.10 RustCrypto crates sqlx and crc-fast use" },
  { crate = "sha2@0.10.9", reason = "sqlx-core and sqlx-macros-core" },
  { crate = "sha3@0.11.0", reason = "ml-kem (through russh)" },
  { crate = "hashbrown@0.14.5", reason = "dashmap" },
  { crate = "hashbrown@0.16.1", reason = "hashlink and sqlx-core" },
  { crate = "miniz_oxide@0.8.9", reason = "png" },
  { crate = "nom@7.1.3", reason = "asn1-rs, through x509-parser" },
  { crate = "num-bigint@0.4.8", reason = "der-parser, through x509-parser" },
  { crate = "quick-xml@0.41.0", reason = "object_store" },
  { crate = "spin@0.9.9", reason = "flume (through sqlx)" },
  { crate = "syn@2.0.119", reason = "most derive macros, next to syn 3" },
  { crate = "synstructure@0.13.2", reason = "asn1-rs-derive, through x509-parser" },
  { crate = "tower-http@0.6.11", reason = "reqwest" },
  { crate = "untrusted@0.7.1", reason = "aws-lc-rs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
