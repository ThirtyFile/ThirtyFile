# ThirtyFile
#   docker compose up -d
# Then open http://localhost:8080 and sign in as admin. Without THIRTYFILE_ADMIN_PASSWORD, the password
# is created at random on the first start; read it with: docker compose logs thirtyfile | grep password
# Change it right after signing in.
services:
  thirtyfile:
    # The compose.yaml attached to each release names its release line here instead of latest, such as :0.4:
    # `docker compose pull` then brings its repairs (0.4.1, 0.4.2…), and moving to the next line (:0.5) is up to you
    image: ghcr.io/thirtyfile/thirtyfile:latest
    # To build the image from the source code instead, remove the line above and use:
    # build: .
    container_name: thirtyfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Database, settings, thumbnails and uploads in progress
      - ./data:/data
      # Your files (the built-in storage location). Can be a folder on another disk or a NAS mount
      - ./storage:/storage
    environment:
      # Password of the admin account, used on the first start only (or put it in a .env file in this folder)
      THIRTYFILE_ADMIN_PASSWORD: ${THIRTYFILE_ADMIN_PASSWORD:-}
      # Time zone, for example Asia/Taipei (or set TZ in a .env file in this folder)
      TZ: ${TZ:-UTC}
      # Enable when served over HTTPS behind a reverse proxy:
      # THIRTYFILE_SECURE_COOKIE: "true"
      # THIRTYFILE_TRUST_PROXY: "true"
      # THIRTYFILE_MAX_UPLOAD_MB: "0"
      # THIRTYFILE_TRASH_DAYS: "30"
    # Memory: about 100–300 MB in use; on a small NAS you can cap it (ThirtyFile adjusts to the limit on start)
    # mem_limit: 512m
    # Run with as few privileges as possible: the server starts as root only to give the data folders to user 1000
    # (THIRTYFILE_RUN_AS), then switches to it. The root filesystem stays read-only; everything is written to
    # /data and /storage
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    # To reach NAS folders by group, add the group's id; the server keeps it after switching user:
    # group_add: ["2001"]
    # Raise the open file limit for very large folders
    ulimits:
      nofile: 65536
    stop_grace_period: 30s
