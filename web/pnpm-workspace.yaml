# GHSA-68fv-2mgg-jv7q: keep all transitive source-map consumers on the patched release.
overrides:
  "source-map-js@<1.2.2": 1.2.2
catalog:
  # Vite+ and the packages it is built from, which have to be one release each. `vite` is the alias of Vite+'s core that
  # the plugins and the tests import; `vite-plus` and `vite` move together (scripts/check-toolchain.mjs) and are raised
  # by hand, as Dependabot would raise one of the two.
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
  "@vitest/coverage-v8": 5.0.5
peerDependencyRules:
  # The plugins ask for vite ^8 and see the alias's own version number (Vite+ 1.x), which is not a Vite release
  allowAny:
    - vite
